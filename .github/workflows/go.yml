name: Go and PostgreSQL recovery

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pg_version: [16, 18]
        segment_mb: [16, 1]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Set up PostgreSQL ${{ matrix.pg_version }}
        run: |
          mkdir -p diagnostics
          test "$(id -u)" -ne 0
          if ! test -x "/usr/lib/postgresql/${{ matrix.pg_version }}/bin/initdb"; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
            echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "postgresql-${{ matrix.pg_version }}"
          fi
          test -x "/usr/lib/postgresql/${{ matrix.pg_version }}/bin/initdb"
          echo "/usr/lib/postgresql/${{ matrix.pg_version }}/bin" >> "$GITHUB_PATH"
          "/usr/lib/postgresql/${{ matrix.pg_version }}/bin/initdb" --version | tee diagnostics/postgres-version.txt
          grep -Eq "PostgreSQL\) ${{ matrix.pg_version }}\." diagnostics/postgres-version.txt
      - name: Install integration test dependencies
        id: pytest
        run: |
          python3 -m venv tests/integration/.venv
          tests/integration/.venv/bin/python -m pip install -r tests/integration/requirements.txt
          echo "$GITHUB_WORKSPACE/tests/integration/.venv/bin" >> "$GITHUB_PATH"
      - name: Unit tests
        run: go test -count=1 ./... 2>&1 | tee diagnostics/unit.log
      - name: Race detector
        run: CGO_ENABLED=1 go test -race -count=1 ./... 2>&1 | tee diagnostics/race.log
      - name: Vet
        run: go vet ./... 2>&1 | tee diagnostics/vet.log
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: Build static binary
        id: build
        run: CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o wal-fetch . 2>&1 | tee diagnostics/build.log
      - name: PostgreSQL recovery and slot lifecycle
        env:
          WAL_FETCH_TEST_SEGMENT_MB: ${{ matrix.segment_mb }}
          WAL_FETCH_TEST_PG_VERSION: ${{ matrix.pg_version }}
          WAL_FETCH_TEST_WORK: /tmp
          WAL_FETCH_TEST_EVIDENCE: ${{ github.workspace }}/diagnostics/recovery
        run: python -m pytest tests/integration -v 2>&1 | tee diagnostics/integration.log
      - name: PostgreSQL recovery without slots
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.pytest.outcome == 'success' }}
        env:
          WAL_FETCH_TEST_SEGMENT_MB: ${{ matrix.segment_mb }}
          WAL_FETCH_TEST_PG_VERSION: ${{ matrix.pg_version }}
          WAL_FETCH_TEST_NO_SLOT: '1'
          WAL_FETCH_TEST_WORK: /tmp
          WAL_FETCH_TEST_EVIDENCE: ${{ github.workspace }}/diagnostics/recovery
        run: python -m pytest tests/integration -v 2>&1 | tee diagnostics/integration-no-slot.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-pg${{ matrix.pg_version }}-${{ matrix.segment_mb }}MiB
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7

  race:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Set up PostgreSQL 16
        run: |
          mkdir -p diagnostics
          test "$(id -u)" -ne 0
          if ! test -x "/usr/lib/postgresql/16/bin/initdb"; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
            echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-16
          fi
          test -x "/usr/lib/postgresql/16/bin/initdb"
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          "/usr/lib/postgresql/16/bin/initdb" --version | tee diagnostics/postgres-version.txt
          grep -Eq "PostgreSQL\) 16\." diagnostics/postgres-version.txt
      - name: Install integration test dependencies
        run: |
          python3 -m venv tests/integration/.venv
          tests/integration/.venv/bin/python -m pip install -r tests/integration/requirements.txt
          echo "$GITHUB_WORKSPACE/tests/integration/.venv/bin" >> "$GITHUB_PATH"
      - name: Build race-enabled binary
        id: build
        run: CGO_ENABLED=1 go build -race -trimpath -o wal-fetch . 2>&1 | tee diagnostics/build.log
      - name: PostgreSQL recovery with race-enabled binary
        id: pytest
        env:
          WAL_FETCH_TEST_SEGMENT_MB: '16'
          WAL_FETCH_TEST_PG_VERSION: '16'
          WAL_FETCH_TEST_WORK: /tmp
          WAL_FETCH_TEST_EVIDENCE: ${{ github.workspace }}/diagnostics/recovery
        run: python -m pytest tests/integration -v 2>&1 | tee diagnostics/integration-race.log
      - name: PostgreSQL recovery without slots
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.pytest.outcome == 'success' }}
        env:
          WAL_FETCH_TEST_SEGMENT_MB: '16'
          WAL_FETCH_TEST_PG_VERSION: '16'
          WAL_FETCH_TEST_NO_SLOT: '1'
          WAL_FETCH_TEST_WORK: /tmp
          WAL_FETCH_TEST_EVIDENCE: ${{ github.workspace }}/diagnostics/recovery
        run: python -m pytest tests/integration -v 2>&1 | tee diagnostics/integration-race-no-slot.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-race
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
