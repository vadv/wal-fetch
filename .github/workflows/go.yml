name: Go and PostgreSQL recovery

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        segment_mb: [16, 1]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Select preinstalled PostgreSQL 16
        run: |
          mkdir -p diagnostics
          test "$(id -u)" -ne 0
          test -x /usr/lib/postgresql/16/bin/initdb
          echo '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/initdb --version | tee diagnostics/postgres-version.txt
          grep -Eq 'PostgreSQL\) 16\.' diagnostics/postgres-version.txt
      - name: Unit tests
        run: go test -count=1 ./... 2>&1 | tee diagnostics/unit.log
      - name: Race detector
        run: CGO_ENABLED=1 go test -race -count=1 ./... 2>&1 | tee diagnostics/race.log
      - name: Vet
        run: go vet ./... 2>&1 | tee diagnostics/vet.log
      - name: Build static binary
        id: build
        run: CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o wal-fetch . 2>&1 | tee diagnostics/build.log
      - name: PostgreSQL recovery and slot lifecycle
        env:
          WAL_FETCH_TEST_SEGMENT_MB: ${{ matrix.segment_mb }}
          WAL_FETCH_TEST_WORK: /tmp
          WAL_FETCH_TEST_EVIDENCE: ${{ github.workspace }}/diagnostics/recovery
        run: python3 integration.py 2>&1 | tee diagnostics/integration.log
      - name: PostgreSQL recovery without slots
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          WAL_FETCH_TEST_SEGMENT_MB: ${{ matrix.segment_mb }}
          WAL_FETCH_TEST_NO_SLOT: '1'
          WAL_FETCH_TEST_WORK: /tmp
          WAL_FETCH_TEST_EVIDENCE: ${{ github.workspace }}/diagnostics/recovery
        run: python3 integration.py 2>&1 | tee diagnostics/integration-no-slot.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-pg16-${{ matrix.segment_mb }}MiB
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
