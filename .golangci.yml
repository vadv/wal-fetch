version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - copyloopvar
    - errorlint
    - misspell
    - unconvert
    - unparam
  settings:
    errcheck:
      # Best-effort cleanup: closing a descriptor after use, removing a lock or
      # staging file, and printing a version banner all ignore errors on purpose.
      exclude-functions:
        - (*os.File).Close
        # Close is promoted from the unexported net.conn interface, so the
        # exclude entry must use its types.Func.FullName() form.
        - (*net.conn).Close
        - (*net.UnixListener).Close
        # Interface-typed calls exclude by the interface method's full name.
        - (net.Conn).Close
        - (net.Listener).Close
        - (*github.com/jackc/pgx/v5/pgconn.PgConn).Close
        - (*log/syslog.Writer).Close
        - os.Remove
        - os.RemoveAll
        - fmt.Fprintf
        - fmt.Fprintln
    staticcheck:
      # "Unix" in "Unix accept failed" is a proper noun.
      checks: [all, -ST1005]

formatters:
  enable:
    - gofmt
